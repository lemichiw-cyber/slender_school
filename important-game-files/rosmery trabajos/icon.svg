<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#f0d9e8"/>
  <!-- Cat face -->
  <ellipse cx="256" cy="290" rx="110" ry="100" fill="#fce4ef" stroke="#e8a0c0" stroke-width="6"/>
  <!-- Ears -->
  <polygon points="170,210 140,100 220,200" fill="#fce4ef" stroke="#e8a0c0" stroke-width="6"/>
  <polygon points="342,210 372,100 292,200" fill="#fce4ef" stroke="#e8a0c0" stroke-width="6"/>
  <!-- Inner ears -->
  <polygon points="175,215 150,125 215,205" fill="#f8d7e0"/>
  <polygon points="337,215 362,125 297,205" fill="#f8d7e0"/>
  <!-- Eyes -->
  <ellipse cx="210" cy="275" rx="18" ry="22" fill="#5a4a5a"/>
  <ellipse cx="302" cy="275" rx="18" ry="22" fill="#5a4a5a"/>
  <ellipse cx="210" cy="275" rx="8" ry="10" fill="#fff"/>
  <ellipse cx="302" cy="275" rx="8" ry="10" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="256" cy="310" rx="8" ry="6" fill="#e8a0c0"/>
  <!-- Mouth -->
  <path d="M242 320 Q256 340 270 320" fill="none" stroke="#e8a0c0" stroke-width="4" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="160" y1="290" x2="210" y2="305" stroke="#d0c5cd" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="310" x2="210" y2="315" stroke="#d0c5cd" stroke-width="3" stroke-linecap="round"/>
  <line x1="352" y1="290" x2="302" y2="305" stroke="#d0c5cd" stroke-width="3" stroke-linecap="round"/>
  <line x1="352" y1="310" x2="302" y2="315" stroke="#d0c5cd" stroke-width="3" stroke-linecap="round"/>
  <!-- Collar -->
  <path d="M210 370 Q256 395 302 370" fill="none" stroke="#e8a0c0" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="385" r="10" fill="#f8d7e0" stroke="#e8a0c0" stroke-width="3"/>
  <!-- Text -->
  <text x="256" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" font-weight="600" fill="#e8a0c0">R</text>
